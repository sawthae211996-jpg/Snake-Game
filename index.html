<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>မြွေဂိမ်း</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: sans-serif;
    color: #fff;
    touch-action: none;
    overflow: hidden;
  }
  h1 { font-size: 20px; margin-bottom: 8px; color: #4ade80; }
  #score { font-size: 16px; margin-bottom: 10px; }
  canvas {
    background: #16213e;
    border: 2px solid #4ade80;
    border-radius: 8px;
    max-width: 95vw;
    max-height: 60vh;
  }
  #controls {
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    gap: 6px;
    margin-top: 14px;
  }
  .btn {
    background: #0f3460;
    border: 1px solid #4ade80;
    border-radius: 10px;
    color: #4ade80;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
  }
  .btn:active { background: #4ade80; color: #0f3460; }
  .empty { visibility: hidden; }
  #restart {
    margin-top: 10px;
    padding: 8px 20px;
    background: #4ade80;
    border: none;
    border-radius: 8px;
    color: #1a1a2e;
    font-weight: bold;
    font-size: 14px;
  }
</style>
</head>
<body>
  <h1>🐍 မြွေဂိမ်း</h1>
  <div id="score">Score: 0</div>
  <canvas id="game" width="300" height="300"></canvas>
  <div id="controls">
    <div class="empty"></div>
    <div class="btn" data-dir="up">▲</div>
    <div class="empty"></div>
    <div class="btn" data-dir="left">◀</div>
    <div class="empty"></div>
    <div class="btn" data-dir="right">▶</div>
    <div class="empty"></div>
    <div class="btn" data-dir="down">▼</div>
    <div class="empty"></div>
  </div>
  <button id="restart">ပြန်စမယ်</button>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

const GRID = 15;
const CELL = canvas.width / GRID;
let snake, dir, nextDir, food, score, gameOver, speed;

function init() {
  snake = [{x: 7, y: 7}, {x: 6, y: 7}, {x: 5, y: 7}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  gameOver = false;
  speed = 150;
  placeFood();
  scoreEl.textContent = 'Score: 0';
  draw();
}

function placeFood() {
  while (true) {
    const f = {x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID)};
    if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.arc(food.x*CELL + CELL/2, food.y*CELL + CELL/2, CELL/2 - 2, 0, Math.PI*2);
  ctx.fill();
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
    ctx.fillRect(s.x*CELL + 1, s.y*CELL + 1, CELL - 2, CELL - 2);
  });
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ဂိမ်းပြီးပါပြီ', canvas.width/2, canvas.height/2 - 10);
    ctx.font = '16px sans-serif';
    ctx.fillText('Score: ' + score, canvas.width/2, canvas.height/2 + 20);
  }
}

function step() {
  if (gameOver) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
    gameOver = true; draw(); return;
  }
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver = true; draw(); return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = 'Score: ' + score;
    placeFood();
    if (speed > 70) speed -= 3;
  } else {
    snake.pop();
  }
  draw();
}

function changeDir(d) {
  if (d === 'up' && dir.y !== 1) nextDir = {x: 0, y: -1};
  else if (d === 'down' && dir.y !== -1) nextDir = {x: 0, y: 1};
  else if (d === 'left' && dir.x !== 1) nextDir = {x: -1, y: 0};
  else if (d === 'right' && dir.x !== -1) nextDir = {x: 1, y: 0};
}

document.querySelectorAll('.btn').forEach(b => {
  b.addEventListener('click', () => changeDir(b.dataset.dir));
});

document.addEventListener('keydown', e => {
  const map = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
               w:'up', s:'down', a:'left', d:'right'};
  if (map[e.key]) { e.preventDefault(); changeDir(map[e.key]); }
});

let tx, ty;
canvas.addEventListener('touchstart', e => {
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, {passive: true});
canvas.addEventListener('touchend', e => {
  if (!tx) return;
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > Math.abs(dy)) {
    changeDir(dx > 0 ? 'right' : 'left');
  } else {
    changeDir(dy > 0 ? 'down' : 'up');
  }
  tx = ty = null;
}, {passive: true});

document.getElementById('restart').addEventListener('click', () => {
  init();
});

let last = 0;
function loop(t) {
  if (t - last > speed) { step(); last = t; }
  requestAnimationFrame(loop);
}
init();
requestAnimationFrame(loop);
</script>
</body>
  </html>
